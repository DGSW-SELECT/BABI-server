spring:
  datasource:
    url: jdbc:h2:mem:babi-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
  mail:
    host: localhost
    username: test@babi.local
email:
  verification:
    secret: test-only-email-verification-secret
# Ephemeral test-only secret; never reads the local or production JWT secret.
jwt:
  secret: "${random.uuid}${random.uuid}"
  access-token-expiration-minutes: 30

# Tests must not call the real STT API.
stt:
  api-key: test-key

# The rate-limiter has dedicated isolated Redis tests.
BABI_EMAIL_SEND_GLOBAL_PER_MINUTE: 10000
BABI_EMAIL_SEND_SOURCE_PER_MINUTE: 10000
