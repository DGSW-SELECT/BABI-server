spring:
  datasource:
    url: jdbc:h2:mem:babi-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  mail:
    host: localhost
    username: test@babi.local
email:
  verification:
    secret: test-only-email-verification-secret
# Ephemeral test-only secret; never reads the local or production JWT secret.
jwt:
  secret: "${random.uuid}${random.uuid}"
  access-token-expiration-minutes: 30

# Tests must not call the real STT API or run the background worker.
stt:
  provider: fake
  api-key: test-key
  fake-transcript: 분유 120ml 먹였어요
  jobs:
    storage-dir: ${java.io.tmpdir}/babi-test-stt
    worker:
      enabled: false
