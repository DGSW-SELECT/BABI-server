spring:
  application:
    name: babi-server
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  sql:
    init:
      mode: never
  mail:
    properties:
      mail:
        smtp:
          # Milliseconds per SMTP connect, read and write operation.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
jwt:
  access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:30}
stt:
  base-url: ${STT_BASE_URL:https://api.openai.com/v1}
  api-key: ${OPENAI_API_KEY:}
  model: ${STT_MODEL:whisper-1}
  language: ${STT_LANGUAGE:ko}
  timeout: ${STT_TIMEOUT:60s}

springdoc:
  packages-to-scan: com.select.domain

baby:
  invitation:
    link-base-url: ${BABY_INVITATION_LINK_BASE_URL:}
