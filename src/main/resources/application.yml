spring:
  application:
    name: babi-server
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
jwt:
  access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:30}
stt:
  base-url: ${STT_BASE_URL:https://api.openai.com/v1}
  api-key: ${OPENAI_API_KEY:}
  model: ${STT_MODEL:whisper-1}
  language: ${STT_LANGUAGE:ko}
  timeout: ${STT_TIMEOUT:60s}
