spring:
  application:
    name: babi-server
  sql:
    init:
      mode: never
  mail:
    properties:
      mail:
        smtp:
          # Milliseconds per SMTP connect, read and write operation.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
jwt:
  access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:30}

springdoc:
  packages-to-scan: com.select.domain

baby:
  invitation:
    link-base-url: ${BABY_INVITATION_LINK_BASE_URL:}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-5-mini}
