spring:
  config:
    activate:
      on-profile: local
    import: optional:file:./.env[.properties]
  datasource:
    url: ${BABI_DEMO_DB_URL:jdbc:mysql://localhost:3307/babi}
    username: babi_user
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${BABI_DEMO_REDIS_HOST:localhost}
      port: ${BABI_DEMO_REDIS_PORT:6379}
      password: ${BABI_DEMO_REDIS_PASSWORD:}

email:
  verification:
    secret: ${EMAIL_VERIFICATION_SECRET}
jwt:
  secret: ${JWT_SECRET}

server:
  forward-headers-strategy: none
