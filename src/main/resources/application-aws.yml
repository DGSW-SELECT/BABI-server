spring:
  config:
    activate:
      on-profile: aws
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3307/babi}
    username: ${SPRING_DATASOURCE_USERNAME:babi_user}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD}}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${BABI_DEMO_REDIS_HOST:127.0.0.1}
      port: ${BABI_DEMO_REDIS_PORT:6379}
      password: ${BABI_DEMO_REDIS_PASSWORD:}
      timeout: 2s

email:
  verification:
    secret: ${EMAIL_VERIFICATION_SECRET}
jwt:
  secret: ${JWT_SECRET}
server:
  address: 127.0.0.1
  port: 8080
  forward-headers-strategy: native
