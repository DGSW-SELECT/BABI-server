name: AWS main build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Test deployment failure and rollback paths
        run: python3 -m unittest discover -s deploy -p 'test_*.py' -v
      - name: Build and test with real Redis
        env:
          BABI_REDIS_TEST_PORT: "6379"
        run: ./gradlew build --no-daemon -PgitCommit="$GITHUB_SHA"
      - name: Verify records and reports against isolated final MySQL schema
        run: |
          docker pull --quiet mysql:8.4
          python3 scripts/check_final_schema_isolated.py src/main/resources/schema.sql --app-test
      - name: Verify the actual Spring Boot JAR metadata
        env:
          PYTHONPATH: deploy
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from pull_deploy import verify_jar
          verify_jar(Path('build/libs/babi-server-0.0.1-SNAPSHOT.jar'), os.environ['GITHUB_SHA'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aws-jar
          path: build/libs/babi-server-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.repository == 'DGSW-SELECT/BABI-server' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: aws-jar
      - name: Publish tested main JAR for the EC2 deployment timer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          mv babi-server-0.0.1-SNAPSHOT.jar babi-server.jar
          tag="aws-$REVISION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already published: $tag"
          else
            gh release create "$tag" babi-server.jar --target "$REVISION" \
              --title "AWS main ${REVISION:0:12}" --notes "Main build and Redis integration tests passed." \
              --prerelease --latest=false
          fi
