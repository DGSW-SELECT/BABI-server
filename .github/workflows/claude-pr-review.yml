name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check Claude configuration and diagnostics
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is missing. Set the repository secret using claude setup-token."
            exit 1
          fi
          python3 -m unittest discover -s scripts -p 'test_claude_review_diagnostics.py'

      - uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1
        id: claude
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 PR을 리뷰해줘. AGENTS.md의 규칙을 기준으로 삼아.
            확인 항목: 버그/로직 오류, 보안(인증·권한·SQL injection·secret 노출),
            Spring Boot 계층 구조(domain/controller·service·repository) 준수,
            예외 처리, 성능, 테스트 누락, 커밋/브랜치 컨벤션.

            구체적 문제는 해당 라인에 inline comment로 남기고,
            전체 요약은 한국어로 PR comment 하나로 남겨.
            문제 없으면 짧게 승인 의견만 남겨.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      - name: Explain Claude failure safely
        if: failure() && steps.claude.outcome == 'failure'
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python3 scripts/claude_review_diagnostics.py
