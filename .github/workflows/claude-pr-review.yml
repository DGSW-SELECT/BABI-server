name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 PR을 리뷰해줘. AGENTS.md의 규칙을 기준으로 삼아.
            확인 항목: 버그/로직 오류, 보안(인증·권한·SQL injection·secret 노출),
            Spring Boot 계층 구조(domain/controller·service·repository) 준수,
            예외 처리, 성능, 테스트 누락, 커밋/브랜치 컨벤션.

            구체적 문제는 해당 라인에 inline comment로 남기고,
            전체 요약은 한국어로 PR comment 하나로 남겨.
            문제 없으면 짧게 승인 의견만 남겨.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
